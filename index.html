<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YSSE OM Information System</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/ysse-operations/info-system/main/Operations%20Management%20Logo%20(Green).png">
    <link rel="manifest" href="/manifest.json">
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #ffffff;
        }
        iframe {
            width: 100%; height: calc(100% - 50px); border: none;
        }
        /* Sleek 1-Click Install Bar */
        #install-bar {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 50px;
            background-color: #0b6623; color: white; display: flex;
            align-items: center; justify-content: space-between; padding: 0 20px;
            box-sizing: border-box; font-family: sans-serif; font-size: 14px; z-index: 9999;
        }
        #install-bar button {
            background-color: white; color: #0b6623; border: none;
            padding: 6px 16px; border-radius: 4px; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Direct Native Prompt Button -->
    <div id="install-bar">
        <span>📲 Install YSSE OM App</span>
        <button id="real-install-btn">Install Now</button>
    </div>

    <iframe src="https://script.google.com/macros/s/AKfycbxYoTJ6DgKSf1FGNxr3RHtmn0Tq6lhmOp2oeinTdPJyfWXiqr8O7heMTx_ymvHJWSK-/exec" allow="clipboard-write; script"></iframe>

    <script>
        let deferredPrompt;
        const installBtn = document.getElementById('real-install-btn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                // This triggers the browser's native system install popup instantly!
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                deferredPrompt = null;
            } else {
                alert("To install, use your browser menu (Chrome/Edge settings -> 'Install app' or 'Add to Home screen').");
            }
        });
    </script>
</body>
</html>
