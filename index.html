<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YSSE OM Information System</title>
    <!-- Logo Icon -->
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/ysse-operations/info-system/main/Operations%20Management%20Logo%20(Green).png">
    <!-- PWA Manifest Link -->
    <link rel="manifest" href="/manifest.json">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        /* Style for the floating install button */
        #install-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #0b6623; /* Matching green color */
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 30px;
            font-family: sans-serif;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            display: none; /* Hidden by default until ready */
            z-index: 9999;
            transition: background 0.3s;
        }
        #install-btn:hover {
            background-color: #094d1a;
        }
    </style>
</head>
<body>

    <!-- The Install Button -->
    <button id="install-btn">📱 Add to Home Screen</button>

    <!-- The App Frame -->
    <iframe src="https://script.google.com/macros/s/AKfycbxYoTJ6DgKSf1FGNxr3RHtmn0Tq6lhmOp2oeinTdPJyfWXiqr8O7heMTx_ymvHJWSK-/exec" allow="clipboard-write; script"></iframe>

    <script>
        let deferredPrompt;
        const installBtn = document.getElementById('install-btn');

        window.addEventListener('beforeinstallprompt', (e) => {
            // Prevent Chrome from automatically showing the mini-infobar
            e.preventDefault();
            // Stash the event so it can be triggered later.
            deferredPrompt = e;
            // Show our custom button
            installBtn.style.display = 'block';
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                // Show the install prompt
                deferredPrompt.prompt();
                // Wait for the user to respond to the prompt
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    console.log('User accepted the install prompt');
                }
                deferredPrompt = null;
                // Hide the button after clicking
                installBtn.style.display = 'none';
            }
        });
    </script>
</body>
</html>
